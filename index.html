<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property Profit Plus â€” Real Estate Income Projections</title>
<style>
  :root{
    color-scheme: light;
    --navy:#141d2e; --navy-2:#1c2740; --gold:#d9a441; --gold-soft:#f3e3c3;
    --surface:#ffffff; --page:#f4f5f7;
    --ink-1:#10131a; --ink-2:#4d5361; --ink-m:#8a8f9c;
    --grid:#e4e5ea; --border:rgba(16,19,26,.10);
    --accent:#2a78d6; --good:#006300; --bad:#b12a2a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink-1);
    font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  .hero-band{background:var(--navy);color:#fff;padding:30px 20px 64px}
  .hero-inner{max-width:1020px;margin:0 auto}
  .hero-band h1{font-size:30px;font-weight:700;margin:0 0 8px}
  .hero-band h1 .gold{color:var(--gold)}
  .hero-band p{margin:0;color:#c6cbd6;font-size:15px;max-width:640px}
  .badge{display:inline-block;background:#fff;border-radius:12px;padding:10px 14px;
    margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .badge img{display:block;height:56px;width:auto}
  .wrap{max-width:1020px;margin:-40px auto 40px;padding:0 20px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:20px;box-shadow:0 2px 10px rgba(16,19,26,.05)}
  .card+.card{margin-top:16px}
  .card h2{font-size:13px;font-weight:650;color:var(--ink-2);margin:0 0 14px;
    text-transform:uppercase;letter-spacing:.05em}
  .modes{display:flex;background:var(--page);border-radius:12px;padding:5px;gap:5px;margin-bottom:20px}
  .mode{flex:1;text-align:center;padding:11px;border:0;border-radius:9px;font:inherit;
    font-weight:650;color:var(--ink-2);background:transparent;cursor:pointer}
  .mode[aria-selected="true"]{background:var(--surface);color:var(--ink-1);
    box-shadow:0 1px 5px rgba(16,19,26,.12)}
  .slider-row{margin:16px 0}
  .slider-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .slider-head label{font-weight:650;font-size:15px}
  .slider-head .ic{color:var(--gold);margin-right:7px}
  .slider-head input[type=number]{width:110px;padding:7px 9px;font:inherit;font-weight:650;
    text-align:right;border:1px solid var(--border);border-radius:8px;background:var(--page);color:var(--ink-1)}
  input[type=range]{width:100%;margin:12px 0 4px;accent-color:var(--navy-2)}
  .range-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-m)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}
  .field{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 0}
  .field label{font-size:13.5px;color:var(--ink-2)}
  .field input{width:104px;padding:6px 8px;font:inherit;font-size:14px;text-align:right;
    color:var(--ink-1);background:var(--page);border:1px solid var(--border);border-radius:7px}
  input:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .tile{border:1px solid var(--border);border-radius:11px;padding:12px 14px;background:var(--page)}
  .tile .tl{font-size:12px;color:var(--ink-2)}
  .tile .tv{font-size:21px;font-weight:650;margin-top:3px}
  .takehome{background:var(--navy);color:#fff;border-color:var(--navy)}
  .takehome .tl{color:#c6cbd6}
  .takehome .tv{color:var(--gold);font-size:26px}
  .focus-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .focus{border:1px solid var(--gold-soft);background:#fdf9f0;border-radius:11px;padding:12px 14px}
  .focus .fv{font-size:24px;font-weight:700;color:var(--navy)}
  .focus .fl{font-size:12.5px;color:var(--ink-2);margin-top:2px}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{padding:7px 9px;text-align:right;font-variant-numeric:tabular-nums}
  th:first-child,td:first-child{text-align:left;font-weight:600}
  thead th{color:var(--ink-2);font-weight:600;border-bottom:1px solid var(--grid)}
  tbody tr+tr td{border-top:1px solid var(--grid)}
  .funnelbar{height:10px;border-radius:5px;background:var(--gold-soft);position:relative;margin-top:3px}
  .funnelbar>i{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--gold)}
  details{margin-top:4px}
  summary{font-size:13px;color:var(--ink-2);cursor:pointer;font-weight:600;padding:6px 0}
  .reset{display:none;margin-left:10px;font:inherit;font-size:12.5px;font-weight:600;
    border:1px solid var(--border);background:var(--surface);color:var(--accent);
    padding:4px 12px;border-radius:7px;cursor:pointer}
  .reset.show{display:inline-block}
  .rev-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .rev-row label{font-weight:650}
  .rev-row input{width:140px;padding:8px 10px;font:inherit;font-weight:650;text-align:right;
    border:1px solid var(--border);border-radius:8px;background:var(--page)}
  .rev-out{font-size:14px;color:var(--ink-2)}
  .rev-out b{color:var(--ink-1)}
  .note{font-size:11.5px;color:var(--ink-m);margin-top:14px;line-height:1.5}
  .bkd{display:flex;height:22px;border-radius:6px;overflow:hidden;margin-top:16px;gap:2px;background:var(--surface)}
  .bkd>i{display:block;height:100%;border-radius:3px}
  .bkd-legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2);margin-top:8px}
  .bkd-legend .keydot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
  .scen-btn{font:inherit;font-weight:650;border:0;border-radius:9px;background:var(--navy);
    color:#fff;padding:9px 18px;cursor:pointer}
  .scen-del{font:inherit;font-size:12px;border:0;background:none;color:var(--bad);cursor:pointer}
  .ws-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .ws-bar label{font-weight:650;font-size:14px}
  .ws-bar input{flex:1;min-width:160px;padding:8px 10px;font:inherit;border:1px solid var(--border);
    border-radius:8px;background:var(--page)}
  .btn{font:inherit;font-weight:650;border:0;border-radius:9px;background:var(--navy);
    color:#fff;padding:9px 16px;cursor:pointer}
  .btn.ghost{background:var(--page);color:var(--ink-1);border:1px solid var(--border)}
  .btn.gold{background:var(--gold);color:var(--navy)}
  .ws-panel{margin-top:14px;border-top:1px solid var(--grid);padding-top:14px}
  .ws-panel textarea{width:100%;min-height:64px;font:12.5px/1.5 ui-monospace,monospace;
    padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--page);
    color:var(--ink-1);word-break:break-all;resize:vertical}
  .ws-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px;align-items:center}
  .banner{background:var(--gold-soft);border:1px solid var(--gold);border-radius:10px;
    padding:10px 14px;margin-bottom:14px;font-size:14px;display:none}
  .ebu-only{display:none}
  body[data-mode="ebu"] .ebu-only{display:flex}
</style>
</head>
